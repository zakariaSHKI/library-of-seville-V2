<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Library of Seville</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="output/images/logo.png" type="image/png">
  <style>
    body { font-family: Inter, sans-serif; padding: 24px; max-width: 1100px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .card { background: #fff; border: 1px solid var(--color-border); border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow-sm); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
    input, textarea, select { width: 100%; padding: 10px 12px; border: 1px solid var(--color-border); border-radius: 8px; }
    label { display: block; margin-bottom: 6px; font-size: 14px; color: var(--color-text-secondary); }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid var(--color-border); }
    .actions { display: flex; gap: 8px; }
    .btn { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--color-primary); background: var(--color-primary); color: #fff; cursor: pointer; }
    .btn-ghost { background: transparent; color: var(--color-text); border-color: var(--color-border); }
    .hidden { display: none; }
    pre { background: #f7f7f7; padding: 10px; border-radius: 8px; overflow: auto; }
  </style>
</head>
<body>
  <header>
    <h1>Library of Seville - Admin</h1>
    <div>
      <input id="apiKey" type="password" placeholder="Admin API Key" style="width: 260px;">
      <button class="btn" id="loadAll">Load Data</button>
    </div>
  </header>

  <section class="card">
    <h2>Books</h2>
    <div class="grid">
      <div>
        <label for="bookTitle">Title *</label>
        <input id="bookTitle" placeholder="Book title" required>
      </div>
      <div>
        <label for="bookAuthor">Author *</label>
        <input id="bookAuthor" placeholder="Author name" required>
      </div>
      <div>
        <label for="bookYear">Year</label>
        <input id="bookYear" placeholder="Publication year (e.g. 2024)">
      </div>
      <div>
        <label for="bookCover">Cover Image URL (optional)</label>
        <input id="bookCover" placeholder="e.g. /output/images/books/book.jpg or https://...">
      </div>
    </div>

    <div style="margin-top:14px; padding:14px; border:1px solid var(--color-border); border-radius:10px; background: #fafafa;">
      <label for="bookCoverFile" style="font-weight:600; color:var(--color-text); margin-bottom:4px;">
        📸 Upload Book Picture from Device
      </label>
      <div style="font-size:13px; color:var(--color-text-secondary); margin-bottom:10px;">
        Choose an image file from your computer or phone (JPG, PNG, WebP, GIF, max 5MB). It will be saved directly into the bookstore's collection.
      </div>
      <input type="file" id="bookCoverFile" accept="image/png,image/jpeg,image/webp,image/gif,image/avif" style="padding:8px 10px; background:#fff; cursor:pointer;">
      
      <div id="coverPreviewContainer" style="display:none; align-items:center; gap:16px; margin-top:12px; padding:10px 14px; background:#fff; border:1px dashed var(--color-border); border-radius:8px;">
        <img id="coverPreviewImg" src="" alt="Cover preview" style="width:50px; height:70px; object-fit:cover; border-radius:4px; border:1px solid var(--color-border);">
        <div style="flex:1;">
          <div id="coverFileName" style="font-weight:600; font-size:14px;"></div>
          <div id="coverFileSize" style="font-size:12px; color:var(--color-text-secondary); margin-top:2px;"></div>
        </div>
        <button type="button" id="removeCoverBtn" class="btn btn-ghost" style="font-size:12px; padding:6px 12px;">Remove Image</button>
      </div>
    </div>

    <div style="margin-top:12px;">
      <label for="bookSummary">Summary</label>
      <textarea id="bookSummary" rows="3" placeholder="Brief description of the book..."></textarea>
    </div>
    <div class="actions" style="margin-top:12px;">
      <button class="btn" id="addBook">Add Book</button>
      <button class="btn btn-ghost" id="clearBook">Clear</button>
    </div>
    <div style="margin-top:16px; overflow:auto;">
      <table id="booksTable">
        <thead><tr><th>ID</th><th>Cover</th><th>Title</th><th>Author</th><th>Year</th><th>Actions</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section class="card">
    <h2>Orders</h2>
    <div style="overflow:auto;">
      <table id="ordersTable">
        <thead><tr><th>ID</th><th>Customer</th><th>Email</th><th>Phone</th><th>Book</th><th>Qty</th><th>Address</th><th>Created</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section class="card">
    <h2>Contacts</h2>
    <div style="overflow:auto;">
      <table id="contactsTable">
        <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Subject</th><th>Message</th><th>Created</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <script>
    const apiKeyInput = document.getElementById('apiKey');
    const headers = () => ({ 'x-api-key': apiKeyInput.value, 'Content-Type': 'application/json' });

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function loadAll() {
      if (!apiKeyInput.value) { alert('Enter API key'); return; }
      try {
        const [books, orders, contacts] = await Promise.all([
          fetch('/api/books').then(r => r.json()),
          fetch('/api/admin/orders', { headers: { 'x-api-key': apiKeyInput.value } }).then(r => r.json()),
          fetch('/api/admin/contacts', { headers: { 'x-api-key': apiKeyInput.value } }).then(r => r.json())
        ]);
        renderBooks(books);
        renderOrders(orders);
        renderContacts(contacts);
      } catch (e) { console.error(e); alert('Failed to load'); }
    }

    function renderBooks(books) {
      const tbody = document.querySelector('#booksTable tbody');
      tbody.innerHTML = books.map(b => `
        <tr>
          <td>${b.id}</td>
          <td style="width: 50px;">
            ${b.coverUrl ? `<img src="${escapeHtml(b.coverUrl)}" alt="" style="width: 38px; height: 54px; object-fit: cover; border-radius: 4px; display: block; border: 1px solid var(--color-border);">` : '<span style="color:var(--color-text-muted);">-</span>'}
          </td>
          <td><strong>${escapeHtml(b.title)}</strong></td>
          <td>${escapeHtml(b.author)}</td>
          <td>${escapeHtml(b.year||'')}</td>
          <td class="actions">
            <button class="btn btn-ghost" onclick='deleteBook(${b.id})'>Delete</button>
          </td>
        </tr>`).join('');
    }
    function renderOrders(orders) {
      const tbody = document.querySelector('#ordersTable tbody');
      tbody.innerHTML = orders.reverse().map(o => `<tr><td>${escapeHtml(o.id.slice(0,8))}</td><td>${escapeHtml(o.firstName)} ${escapeHtml(o.lastName)}</td><td>${escapeHtml(o.email||'-')}</td><td>${escapeHtml(o.phone)}</td><td>${escapeHtml(o.bookTitle||'')} (ID:${o.bookId||'-'})</td><td>${o.quantity}</td><td>${escapeHtml(o.address)}, ${escapeHtml(o.city)}, ${escapeHtml(o.wilaya)}</td><td>${new Date(o.createdAt).toLocaleString()}</td></tr>`).join('');
    }
    function renderContacts(contacts) {
      const tbody = document.querySelector('#contactsTable tbody');
      tbody.innerHTML = contacts.reverse().map(c => `<tr><td>${escapeHtml(c.id.slice(0,8))}</td><td>${escapeHtml(c.name)}</td><td>${escapeHtml(c.email)}</td><td>${escapeHtml(c.subject||'')}</td><td><pre>${escapeHtml(c.message)}</pre></td><td>${new Date(c.createdAt).toLocaleString()}</td></tr>`).join('');
    }

    // Book Cover File Upload Handling
    const coverFileInput = document.getElementById('bookCoverFile');
    const coverPreviewContainer = document.getElementById('coverPreviewContainer');
    const coverPreviewImg = document.getElementById('coverPreviewImg');
    const coverFileName = document.getElementById('coverFileName');
    const coverFileSize = document.getElementById('coverFileSize');
    const removeCoverBtn = document.getElementById('removeCoverBtn');
    const coverUrlInput = document.getElementById('bookCover');
    const addBtn = document.getElementById('addBook');

    let selectedCoverFile = null;

    coverFileInput.addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      if (!file.type.startsWith('image/')) {
        alert('Please select an image file (PNG, JPG, WebP, GIF, AVIF).');
        coverFileInput.value = '';
        return;
      }
      if (file.size > 5 * 1024 * 1024) {
        alert('Image must be under 5MB.');
        coverFileInput.value = '';
        return;
      }

      selectedCoverFile = file;
      coverFileName.textContent = file.name;
      coverFileSize.textContent = (file.size / 1024).toFixed(1) + ' KB';

      const reader = new FileReader();
      reader.onload = (evt) => {
        coverPreviewImg.src = evt.target.result;
        coverPreviewContainer.style.display = 'flex';
      };
      reader.readAsDataURL(file);
    });

    removeCoverBtn.addEventListener('click', () => {
      selectedCoverFile = null;
      coverFileInput.value = '';
      coverPreviewImg.src = '';
      coverPreviewContainer.style.display = 'none';
    });

    addBtn.onclick = async () => {
      if (!apiKeyInput.value) {
        alert('Please enter your Admin API Key at the top first.');
        apiKeyInput.focus();
        return;
      }

      const title = document.getElementById('bookTitle').value.trim();
      const author = document.getElementById('bookAuthor').value.trim();
      if (!title || !author) {
        alert('Title and Author are required.');
        return;
      }

      addBtn.disabled = true;
      const originalText = addBtn.textContent;

      try {
        let finalCoverUrl = coverUrlInput.value.trim();

        // 1. If user chose a file from their device, upload it first
        if (selectedCoverFile) {
          addBtn.textContent = 'Uploading picture...';
          const formData = new FormData();
          formData.append('coverImage', selectedCoverFile);

          const upRes = await fetch('/api/upload-cover', {
            method: 'POST',
            headers: { 'x-api-key': apiKeyInput.value },
            body: formData
          });
          const upData = await upRes.json();
          if (!upRes.ok) {
            throw new Error(upData.error || 'Failed to upload cover picture.');
          }
          finalCoverUrl = upData.url;
        }

        // 2. Create the book record
        addBtn.textContent = 'Saving book...';
        const body = {
          title: title,
          author: author,
          year: document.getElementById('bookYear').value.trim(),
          coverUrl: finalCoverUrl,
          summary: document.getElementById('bookSummary').value.trim()
        };

        const res = await fetch('/api/books', {
          method: 'POST',
          headers: headers(),
          body: JSON.stringify(body)
        });
        const bookData = await res.json();
        if (!res.ok) throw new Error(bookData.error || 'Failed to add book.');

        alert(`Book "${bookData.title}" added successfully!`);
        document.getElementById('clearBook').click();
        loadAll();
      } catch (err) {
        alert(err.message || 'Failed to add book.');
      } finally {
        addBtn.disabled = false;
        addBtn.textContent = originalText;
      }
    };

    document.getElementById('clearBook').onclick = () => {
      ['bookTitle','bookAuthor','bookYear','bookCover','bookSummary'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = '';
      });
      selectedCoverFile = null;
      if (coverFileInput) coverFileInput.value = '';
      if (coverPreviewImg) coverPreviewImg.src = '';
      if (coverPreviewContainer) coverPreviewContainer.style.display = 'none';
    };
    window.deleteBook = async (id) => {
      if (!confirm('Delete book?')) return;
      const res = await fetch(`/api/books/${id}`, { method: 'DELETE', headers: { 'x-api-key': apiKeyInput.value } });
      if (res.ok) loadAll(); else alert('Failed');
    };
    document.getElementById('loadAll').onclick = loadAll;
  </script>
</body>
</html>
